<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
 <defs><style>.h{fill:#17213a}.ht{font:700 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:white;text-anchor:middle}.lane{stroke:#ccd3e8;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#53617d;stroke-width:2.4;fill:none;marker-end:url(#a)}.ret{stroke:#76819a;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}.tx{font:17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26314d;text-anchor:middle}.note{fill:#eef3ff;stroke:#9bacff;stroke-width:1.5}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53617d"/></marker></defs>
 <rect width="1600" height="1080" rx="24" fill="#fbfcff"/>
 <g><rect class="h" x="40" y="35" width="220" height="62" rx="14"/><text class="ht" x="150" y="74">商户服务端</text><rect class="h" x="360" y="35" width="220" height="62" rx="14"/><text class="ht" x="470" y="74">DSPay API</text><rect class="h" x="690" y="35" width="220" height="62" rx="14"/><text class="ht" x="800" y="74">DSPay 收银台</text><rect class="h" x="1020" y="35" width="220" height="62" rx="14"/><text class="ht" x="1130" y="74">用户</text><rect class="h" x="1340" y="35" width="220" height="62" rx="14"/><text class="ht" x="1450" y="74">区块链</text></g>
 <g><path class="lane" d="M150 97V970"/><path class="lane" d="M470 97V970"/><path class="lane" d="M800 97V970"/><path class="lane" d="M1130 97V970"/><path class="lane" d="M1450 97V970"/></g>
 <path class="msg" d="M150 135H470"/><text class="tx" x="310" y="123">GET /dspay/public/supported-chains</text><path class="ret" d="M470 180H150"/><text class="tx" x="310" y="168">平台支持的网络和代币</text>
 <path class="msg" d="M150 240H470"/><text class="tx" x="310" y="228">POST /dspay/public/order/create（HMAC）</text><path class="ret" d="M470 290H150"/><text class="tx" x="310" y="278">返回 orderNo、checkoutUrl、expireAt</text>
 <path class="msg" d="M150 350H1130"/><text class="tx" x="640" y="338">商户将用户跳转到 checkoutUrl</text><path class="msg" d="M1130 410H800"/><text class="tx" x="965" y="398">访问 /checkout/{orderNo}</text><path class="msg" d="M800 460H470"/><text class="tx" x="635" y="448">加载订单和可选支付方式</text><path class="ret" d="M470 510H800"/><text class="tx" x="635" y="498">返回 CREATED、支付方式和倒计时</text>
 <path class="msg" d="M1130 570H800"/><text class="tx" x="965" y="558">选择网络/代币，点击 Pay Now</text><path class="msg" d="M800 620H470"/><text class="tx" x="635" y="608">填充订单支付信息</text><path class="ret" d="M470 670H800"/><text class="tx" x="635" y="658">幂等锁定地址、金额和支付方式</text>
 <path class="msg" d="M800 730H470"/><text class="tx" x="635" y="718">查询订单支付结果</text><path class="msg" d="M1130 780H1450"/><text class="tx" x="1290" y="768">向商户收款地址发起链上转账</text><path class="ret" d="M1450 835H470"/><text class="tx" x="960" y="823">DSPay 检测到账，订单变为 COMPLETED</text>
 <path class="msg" d="M470 890H150"/><text class="tx" x="310" y="878">POST notifyUrl（Raw Body HMAC）</text><path class="msg" d="M150 945H470"/><text class="tx" x="310" y="933">POST /dspay/public/order/query（主动确认）</text>
 <rect class="note" x="40" y="995" width="550" height="62" rx="12"/><text class="tx" x="315" y="1033">订单创建满180天后，checkoutUrl不再允许查看</text>
 <rect class="note" x="630" y="985" width="930" height="78" rx="12"/><text class="tx" x="1095" y="1017">COMPLETED且配置successRedirectUrl：跳转商户成功页</text><text class="tx" x="1095" y="1047">订单TIMEOUT且配置returnUrl：跳转商户页面</text>
</svg>
