<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
 <defs><style>.h{fill:#17213a}.ht{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:white;text-anchor:middle}.lane{stroke:#ccd3e8;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#53617d;stroke-width:2.4;fill:none;marker-end:url(#a)}.ret{stroke:#76819a;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}.tx{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#26314d;text-anchor:middle}.note{fill:#eef3ff;stroke:#9bacff;stroke-width:1.5}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53617d"/></marker></defs>
 <rect width="1600" height="1080" rx="24" fill="#fbfcff"/>
 <g><rect class="h" x="40" y="35" width="220" height="62" rx="14"/><text class="ht" x="150" y="74">Merchant Server</text><rect class="h" x="360" y="35" width="220" height="62" rx="14"/><text class="ht" x="470" y="74">DSPay API</text><rect class="h" x="690" y="35" width="220" height="62" rx="14"/><text class="ht" x="800" y="74">DSPay Checkout</text><rect class="h" x="1020" y="35" width="220" height="62" rx="14"/><text class="ht" x="1130" y="74">Customer</text><rect class="h" x="1340" y="35" width="220" height="62" rx="14"/><text class="ht" x="1450" y="74">Blockchain</text></g>
 <g><path class="lane" d="M150 97V970"/><path class="lane" d="M470 97V970"/><path class="lane" d="M800 97V970"/><path class="lane" d="M1130 97V970"/><path class="lane" d="M1450 97V970"/></g>
 <path class="msg" d="M150 135H470"/><text class="tx" x="310" y="123">GET /dspay/public/supported-chains</text><path class="ret" d="M470 180H150"/><text class="tx" x="310" y="168">Supported networks and tokens</text>
 <path class="msg" d="M150 240H470"/><text class="tx" x="310" y="228">POST /dspay/public/order/create (HMAC)</text><path class="ret" d="M470 290H150"/><text class="tx" x="310" y="278">orderNo, checkoutUrl, expireAt</text>
 <path class="msg" d="M150 350H1130"/><text class="tx" x="640" y="338">Redirect customer to checkoutUrl</text><path class="msg" d="M1130 410H800"/><text class="tx" x="965" y="398">Visit /checkout/{orderNo}</text><path class="msg" d="M800 460H470"/><text class="tx" x="635" y="448">Load order and available methods</text><path class="ret" d="M470 510H800"/><text class="tx" x="635" y="498">CREATED, methods and countdown</text>
 <path class="msg" d="M1130 570H800"/><text class="tx" x="965" y="558">Select network/token and click Pay Now</text><path class="msg" d="M800 620H470"/><text class="tx" x="635" y="608">Fill in order payment details</text><path class="ret" d="M470 670H800"/><text class="tx" x="635" y="658">Idempotently lock address, amount and method</text>
 <path class="msg" d="M800 730H470"/><text class="tx" x="635" y="718">Check order payment result</text><path class="msg" d="M1130 780H1450"/><text class="tx" x="1290" y="768">Transfer to merchant receiving address</text><path class="ret" d="M1450 835H470"/><text class="tx" x="960" y="823">DSPay detects transfer; order becomes COMPLETED</text>
 <path class="msg" d="M470 890H150"/><text class="tx" x="310" y="878">POST notifyUrl (raw-body HMAC)</text><path class="msg" d="M150 945H470"/><text class="tx" x="310" y="933">POST /dspay/public/order/query</text>
 <rect class="note" x="40" y="995" width="550" height="62" rx="12"/><text class="tx" x="315" y="1033">checkoutUrl cannot be viewed 180 days after creation</text>
 <rect class="note" x="630" y="985" width="930" height="78" rx="12"/><text class="tx" x="1095" y="1017">COMPLETED + successRedirectUrl: redirect to merchant success page</text><text class="tx" x="1095" y="1047">TIMEOUT + returnUrl: redirect to the merchant page</text>
</svg>
