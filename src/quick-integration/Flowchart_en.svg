  <g transform="translate(25 72)"><rect class="b" width="250" height="125" rx="16"/><text class="t" x="125" y="48">Configure merchant</text><text class="s" x="125" y="80">Addresses and API Key</text></g><path class="a" d="M285 135H335"/>
