<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="300" viewBox="0 0 1800 300">
  <defs><style>.b{fill:#f1f3ff;stroke:#8c96ff;stroke-width:2}.t{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18213b;text-anchor:middle}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#65708c;text-anchor:middle}.a{stroke:#58627c;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58627c"/></marker></defs>
